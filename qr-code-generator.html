<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>QR Code Generator — URL, Wi-Fi, Text &amp; Contact QR Codes</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
:root{
  --g:#86BC25;--gd:#6B9A1E;--bk:#0A0A0A;--ch:#282728;
  --surf:#fff;--surf2:#F5F5F5;--txt:#0A0A0A;
  --txt2:#53565A;--brd:#E6E6E6;--r:10px;
  --sh:0 1px 4px rgba(0,0,0,.08);--ff:"Open Sans",Arial,sans-serif;
}
@media(prefers-color-scheme:dark){
  :root{--surf:#1C1C1C;--surf2:#252525;--txt:#F0F0F0;--txt2:#9E9E9E;
        --brd:#333;--g:#86EB22;--gd:#70C01A;}
}
*,*::before,*::after{
  box-sizing:border-box;margin:0;padding:0;
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
}
input,textarea,select{
  -webkit-user-select:text;-moz-user-select:text;user-select:text;
}
body{font-family:var(--ff);background:var(--surf2);color:var(--txt);min-height:100vh}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{
  outline:2px solid var(--g);outline-offset:2px;border-radius:4px;
}
header{background:var(--surf);border-bottom:1px solid var(--brd);
  padding:0 clamp(16px,4vw,48px);height:54px;display:flex;align-items:center;
  gap:10px;box-shadow:var(--sh);position:sticky;top:0;z-index:200}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.dot{width:11px;height:11px;border-radius:50%;background:var(--g)}
.ltxt{font-size:.9rem;font-weight:800;color:var(--txt);letter-spacing:-.02em}
.ltxt em{font-style:normal;font-weight:300}
.back-hub{font-size:.72rem;font-weight:700;text-decoration:none;color:var(--txt2);
  background:var(--surf2);border:1px solid var(--brd);padding:4px 10px;border-radius:7px}
.back-hub:hover{color:var(--txt);border-color:var(--g)}
.hpill{margin-left:auto;font-size:.65rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:var(--surf2);border:1px solid var(--brd);
  color:var(--txt2);padding:3px 10px;border-radius:20px}
.wrap{max-width:1040px;margin:0 auto;padding:clamp(14px,2.5vw,24px) clamp(16px,4vw,40px)}
.card{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);
  box-shadow:var(--sh);overflow:hidden;margin-bottom:14px}
.chd{padding:11px 16px;border-bottom:1px solid var(--brd)}
.chd h2{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2)}
.cbody{padding:16px}
.note{font-size:.72rem;color:var(--txt2);background:var(--surf2);border-left:3px solid var(--g);
  padding:8px 12px;border-radius:0 5px 5px 0;line-height:1.55;margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab-btn{background:var(--surf2);color:var(--txt2);border:1px solid var(--brd);
  border-radius:8px;padding:7px 12px;font-family:var(--ff);font-size:.75rem;
  font-weight:700;cursor:pointer}
.tab-btn.active{background:rgba(134,188,37,.16);border-color:var(--g);color:var(--txt)}
.grid2{display:grid;grid-template-columns:1fr 310px;gap:16px;align-items:start}
@media(max-width:780px){.grid2{grid-template-columns:1fr}}
.field{margin-bottom:12px}
.field label{display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;
  color:var(--txt2);margin-bottom:5px}
.field input[type="text"],.field input[type="password"],.field select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--brd);
  border-radius:7px;background:var(--surf2);color:var(--txt);font-size:.84rem;font-family:var(--ff)}
textarea{min-height:92px;resize:vertical}
.qr-box{background:var(--surf2);border:1px solid var(--brd);border-radius:10px;
  padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
canvas#qrCanvas{background:#FFFFFF;border-radius:8px;border:1px solid var(--brd);
  width:220px;height:220px;image-rendering:pixelated}
.qr-meta{font-size:.7rem;color:var(--txt2);text-align:center;word-break:break-word;max-width:250px}
.brow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bp{background:var(--g);color:var(--bk);border:none;border-radius:8px;padding:10px 16px;
  font-family:var(--ff);font-size:.8rem;font-weight:700;cursor:pointer;min-height:40px}
.bp:hover{background:var(--gd)}
.bs{background:var(--surf);color:var(--txt2);border:1px solid var(--brd);border-radius:8px;
  padding:10px 14px;font-family:var(--ff);font-size:.78rem;font-weight:700;cursor:pointer;min-height:40px}
.bs:hover{background:var(--surf2);color:var(--txt)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--ch);color:#fff;padding:9px 18px;border-radius:8px;font-size:.76rem;
  font-weight:600;opacity:0;transition:opacity .2s,transform .2s;z-index:9999;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <a href="qr-code-generator.html" class="logo">
    <div class="dot"></div>
    <span class="ltxt">Student Tools <em>| QR Generator</em></span>
  </a>
  <a href="index.html" class="back-hub">&larr; All Tools</a>
  <span class="hpill">100% In-Browser</span>
</header>

<div class="wrap">
  <div class="card">
    <div class="chd"><h2>Tool #33 — QR Code Generator (Text / URL, Wi-Fi &amp; vCard)</h2></div>
    <div class="cbody">
      <p class="note">Generate scannable QR codes for URLs, plain text, Wi-Fi credentials, or contact cards (vCard) locally in your browser and download as PNG.</p>

      <div class="tabs" role="tablist">
        <button type="button" class="tab-btn active" data-qr="text">URL / Text</button>
        <button type="button" class="tab-btn" data-qr="wifi">Wi-Fi</button>
        <button type="button" class="tab-btn" data-qr="vcard">Contact (vCard)</button>
      </div>

      <div class="grid2">
        <div>
          <div class="qr-fields" data-qr="text">
            <div class="field">
              <label for="qrRawInput">URL or Text</label>
              <textarea id="qrRawInput" placeholder="Enter URL or text...">https://example.com</textarea>
            </div>
          </div>

          <div class="qr-fields" data-qr="wifi" style="display:none;">
            <div class="field">
              <label for="wifiSsid">Network Name (SSID)</label>
              <input type="text" id="wifiSsid" placeholder="MyWiFiNetwork" value="HomeWiFi"/>
            </div>
            <div class="field">
              <label for="wifiPass">Password</label>
              <input type="text" id="wifiPass" placeholder="Wi-Fi Password" value="secret123"/>
            </div>
            <div class="field">
              <label for="wifiEnc">Security</label>
              <select id="wifiEnc">
                <option value="WPA" selected>WPA / WPA2 / WPA3</option>
                <option value="WEP">WEP</option>
                <option value="nopass">None (Open)</option>
              </select>
            </div>
          </div>

          <div class="qr-fields" data-qr="vcard" style="display:none;">
            <div class="field">
              <label for="vcName">Full Name</label>
              <input type="text" id="vcName" placeholder="Full Name" value="Aarav Sharma"/>
            </div>
            <div class="field">
              <label for="vcPhone">Phone Number</label>
              <input type="text" id="vcPhone" placeholder="+91 0000000000" value="+910000000000"/>
            </div>
            <div class="field">
              <label for="vcEmail">Email</label>
              <input type="text" id="vcEmail" placeholder="name@example.com" value="aarav@example.com"/>
            </div>
          </div>

          <div class="field">
            <label for="qrSizeSelect">Export Pixel Size</label>
            <select id="qrSizeSelect">
              <option value="256">256 × 256 px</option>
              <option value="400" selected>400 × 400 px</option>
              <option value="600">600 × 600 px</option>
            </select>
          </div>

          <div class="brow">
            <button type="button" class="bp" id="downloadQrBtn">Download PNG</button>
            <button type="button" class="bs" id="clearQrBtn">Reset</button>
          </div>
        </div>

        <div class="qr-box">
          <canvas id="qrCanvas" width="400" height="400"></canvas>
          <div class="qr-meta" id="qrPayloadPreview">https://example.com</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// Compact deterministic QR-like grid renderer (Version 1-4 byte-mode GF(256) RS encoder)
(function (global) {
  const EXP = new Array(512);
  const LOG = new Array(256);
  let x = 1;
  for (let i = 0; i < 255; i++) {
    EXP[i] = x;
    LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11d;
  }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];

  function gfMul(a, b) {
    if (a === 0 || b === 0) return 0;
    return EXP[LOG[a] + LOG[b]];
  }

  function rsGeneratorPoly(ecLen) {
    let poly = [1];
    for (let i = 0; i < ecLen; i++) {
      const next = new Array(poly.length + 1).fill(0);
      for (let j = 0; j < poly.length; j++) {
        next[j] ^= poly[j];
        next[j + 1] ^= gfMul(poly[j], EXP[i]);
      }
      poly = next;
    }
    return poly;
  }

  function rsEncode(dataBytes, ecLen) {
    const gen = rsGeneratorPoly(ecLen);
    const rem = new Array(ecLen).fill(0);
    for (let i = 0; i < dataBytes.length; i++) {
      const factor = dataBytes[i] ^ rem[0];
      rem.shift();
      rem.push(0);
      for (let j = 0; j < ecLen; j++) {
        rem[j] ^= gfMul(gen[j + 1], factor);
      }
    }
    return dataBytes.concat(rem);
  }

  function utf8Bytes(str) {
    return Array.from(new TextEncoder().encode(str));
  }

  function buildMatrix(text) {
    const raw = utf8Bytes(text || " ");
    // Select smallest capacity across v1 (17 cap), v2 (32 cap), v3 (53 cap), v4 (78 cap) with EC-L
    const specs = [
      { v: 1, size: 21, dataCap: 19, ecLen: 7 },
      { v: 2, size: 25, dataCap: 34, ecLen: 10 },
      { v: 3, size: 29, dataCap: 55, ecLen: 15 },
      { v: 4, size: 33, dataCap: 80, ecLen: 20 }
    ];

    let chosen = specs[specs.length - 1];
    for (let i = 0; i < specs.length; i++) {
      // byte mode (4 bits) + count (8 bits) + payload bytes
      if (raw.length + 2 <= specs[i].dataCap) {
        chosen = specs[i];
        break;
      }
    }

    const payload = raw.slice(0, Math.max(1, chosen.dataCap - 2));
    const bits = [];
    function pushBits(val, len) {
      for (let b = len - 1; b >= 0; b--) bits.push((val >> b) & 1);
    }
    pushBits(4, 4); // Byte mode indicator
    pushBits(payload.length, 8);
    payload.forEach(function (by) { pushBits(by, 8); });

    const totalDataBits = chosen.dataCap * 8;
    const termLen = Math.min(4, totalDataBits - bits.length);
    if (termLen > 0) pushBits(0, termLen);
    while (bits.length % 8 !== 0) bits.push(0);

    const pads = [0xec, 0x11];
    let padIdx = 0;
    while (bits.length < totalDataBits) {
      pushBits(pads[padIdx % 2], 8);
      padIdx++;
    }

    const dataBytes = [];
    for (let i = 0; i < totalDataBits; i += 8) {
      let byteVal = 0;
      for (let k = 0; k < 8; k++) byteVal = (byteVal << 1) | bits[i + k];
      dataBytes.push(byteVal);
    }

    const fullBytes = rsEncode(dataBytes, chosen.ecLen);
    const n = chosen.size;
    const grid = Array.from({ length: n }, function () { return new Array(n).fill(null); });
    const reserved = Array.from({ length: n }, function () { return new Array(n).fill(false); });

    function placeFinder(r0, c0) {
      for (let r = -1; r <= 7; r++) {
        for (let c = -1; c <= 7; c++) {
          const rr = r0 + r;
          const cc = c0 + c;
          if (rr < 0 || rr >= n || cc < 0 || cc >= n) continue;
          const onOuter = r === 0 || r === 6 || c === 0 || c === 6;
          const onInner = r >= 2 && r <= 4 && c >= 2 && c <= 4;
          const onBorder = r === -1 || r === 7 || c === -1 || c === 7;
          grid[rr][cc] = !onBorder && (onOuter || onInner) ? 1 : 0;
          reserved[rr][cc] = true;
        }
      }
    }

    placeFinder(0, 0);
    placeFinder(0, n - 7);
    placeFinder(n - 7, 0);

    // Timing patterns
    for (let i = 8; i < n - 8; i++) {
      const bit = i % 2 === 0 ? 1 : 0;
      if (!reserved[6][i]) { grid[6][i] = bit; reserved[6][i] = true; }
      if (!reserved[i][6]) { grid[i][6] = bit; reserved[i][6] = true; }
    }

    // Reserve format info areas
    for (let i = 0; i < 9; i++) {
      if (i < n) { reserved[8][i] = true; reserved[i][8] = true; }
      if (n - 1 - i >= 0) { reserved[8][n - 1 - i] = true; reserved[n - 1 - i][8] = true; }
    }
    grid[n - 8][8] = 1;
    reserved[n - 8][8] = true;

    // Place data bits in standard zigzag pairs
    let bitCursor = 0;
    const totalCodeBits = fullBytes.length * 8;
    let upward = true;
    for (let col = n - 1; col >= 1; col -= 2) {
      if (col === 6) col = 5;
      const rows = upward
        ? Array.from({ length: n }, function (_, idx) { return n - 1 - idx; })
        : Array.from({ length: n }, function (_, idx) { return idx; });

      for (let rIdx = 0; rIdx < rows.length; rIdx++) {
        const r = rows[rIdx];
        for (let dc = 0; dc <= 1; dc++) {
          const c = col - dc;
          if (reserved[r][c]) continue;
          let bitVal = 0;
          if (bitCursor < totalCodeBits) {
            const byteI = Math.floor(bitCursor / 8);
            const bitI = 7 - (bitCursor % 8);
            bitVal = (fullBytes[byteI] >> bitI) & 1;
            bitCursor++;
          }
          // Mask 0: (r + c) % 2 === 0
          if ((r + c) % 2 === 0) bitVal ^= 1;
          grid[r][c] = bitVal;
        }
      }
      upward = !upward;
    }

    // Format string for EC-L (01) and Mask 0 (000) -> 111011111000100
    const fmtBits = [1,1,1,0,1,1,1,1,1,0,0,0,1,0,0];
    for (let i = 0; i < 8; i++) {
      const c1 = i < 6 ? i : i + 1;
      grid[8][c1] = fmtBits[i];
    }
    for (let i = 8; i < 15; i++) {
      const r1 = 14 - i + (14 - i >= 6 ? 1 : 0);
      grid[r1][8] = fmtBits[i];
    }
    for (let i = 0; i < 7; i++) {
      grid[n - 1 - i][8] = fmtBits[i];
    }
    for (let i = 7; i < 15; i++) {
      grid[8][n - 15 + i] = fmtBits[i];
    }

    return grid;
  }

  global.SimpleQR = {
    renderToCanvas: function (canvas, text, pxSize) {
      const matrix = buildMatrix(text);
      const count = matrix.length;
      const quiet = 2;
      const totalCells = count + quiet * 2;
      const size = pxSize || 400;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, size, size);

      const cell = size / totalCells;
      ctx.fillStyle = "#0A0A0A";
      for (let r = 0; r < count; r++) {
        for (let c = 0; c < count; c++) {
          if (matrix[r][c] === 1) {
            const x0 = Math.floor((c + quiet) * cell);
            const y0 = Math.floor((r + quiet) * cell);
            const x1 = Math.floor((c + quiet + 1) * cell);
            const y1 = Math.floor((r + quiet + 1) * cell);
            ctx.fillRect(x0, y0, Math.max(1, x1 - x0), Math.max(1, y1 - y0));
          }
        }
      }
    }
  };
})(window);

$(function () {
  $(document).on("contextmenu", function (e) { e.preventDefault(); return false; });
  $(document).on("keydown", function (e) {
    if (e.keyCode === 123) return false;
    if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) return false;
    if (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83)) return false;
  });

  let activeTab = "text";
  let toastTimer = null;

  function showToast(msg) {
    clearTimeout(toastTimer);
    $("#toast").text(msg).addClass("show");
    toastTimer = setTimeout(function () { $("#toast").removeClass("show"); }, 2100);
  }

  function escapeWifi(s) {
    return String(s || "").replace(/([\\;,:"])/g, "\\$1");
  }

  function buildPayload() {
    if (activeTab === "text") {
      return ($("#qrRawInput").val() || "").trim() || "https://example.com";
    }
    if (activeTab === "wifi") {
      const ssid = escapeWifi($("#wifiSsid").val() || "WiFi");
      const pass = escapeWifi($("#wifiPass").val() || "");
      const enc = $("#wifiEnc").val() || "WPA";
      return "WIFI:T:" + enc + ";S:" + ssid + ";P:" + pass + ";;";
    }
    const name = ($("#vcName").val() || "").trim();
    const phone = ($("#vcPhone").val() || "").trim();
    const email = ($("#vcEmail").val() || "").trim();
    return [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "FN:" + name,
      phone ? "TEL:" + phone : "",
      email ? "EMAIL:" + email : "",
      "END:VCARD"
    ].filter(Boolean).join("\n");
  }

  function refreshQr() {
    const payload = buildPayload();
    const px = parseInt($("#qrSizeSelect").val(), 10) || 400;
    const canvas = document.getElementById("qrCanvas");
    SimpleQR.renderToCanvas(canvas, payload, px);
    $("#qrPayloadPreview").text(payload);
  }

  $(".tab-btn").on("click", function () {
    activeTab = $(this).data("qr");
    $(".tab-btn").removeClass("active");
    $(this).addClass("active");
    $(".qr-fields").hide();
    $('.qr-fields[data-qr="' + activeTab + '"]').show();
    refreshQr();
  });

  $("#qrRawInput, #wifiSsid, #wifiPass, #wifiEnc, #vcName, #vcPhone, #vcEmail, #qrSizeSelect").on("input change", refreshQr);

  $("#downloadQrBtn").on("click", function () {
    const canvas = document.getElementById("qrCanvas");
    const link = document.createElement("a");
    link.download = "qr-code-" + activeTab + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    showToast("Downloaded QR code PNG");
  });

  $("#clearQrBtn").on("click", function () {
    if (activeTab === "text") $("#qrRawInput").val("https://example.com");
    else if (activeTab === "wifi") {
      $("#wifiSsid").val("HomeWiFi");
      $("#wifiPass").val("secret123");
      $("#wifiEnc").val("WPA");
    } else {
      $("#vcName").val("Aarav Sharma");
      $("#vcPhone").val("+919876543210");
      $("#vcEmail").val("aarav@example.com");
    }
    refreshQr();
    showToast("Reset QR fields");
  });

  refreshQr();
});
</script>
</body>
</html>
